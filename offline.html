<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a3462">
  <title>Hors ligne — Univers Diaspora</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0c1730, #1a3462 55%, #122038);
      color: #fff;
      text-align: center;
    }
    main {
      max-width: 22rem;
    }
    h1 {
      margin: 0 0 .6rem;
      font-size: 1.45rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 1.25rem;
      line-height: 1.5;
      color: rgba(255,255,255,.82);
      font-size: .98rem;
    }
    a {
      display: inline-block;
      padding: .7rem 1.15rem;
      border-radius: 999px;
      background: #d9a04a;
      color: #0c1730;
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre Univers Diaspora pour le moment. Vérifiez votre connexion, puis réessayez.</p>
    <a href="./">Réessayer</a>
  </main>
</body>
</html>
